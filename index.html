<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JPSME Attendance</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 12px; background: #f1f3f6; color: #222; }
    .hidden { display: none; }
    .panel { background: #fff; border-radius: 10px; padding: 16px; max-width: 480px; margin: 20px auto; text-align: center; }
    #app { max-width: 480px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .top button { padding: 6px 12px; }
    label { font-weight: bold; font-size: 14px; }
    select { width: 100%; padding: 10px; font-size: 16px; margin: 4px 0 8px 0; }
    #refresh { padding: 6px 12px; font-size: 14px; margin-bottom: 10px; }
    #stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .stat { background: #fff; border-radius: 8px; padding: 8px 4px; text-align: center; }
    .stat b { display: block; font-size: 22px; }
    .stat span { font-size: 11px; color: #555; }
    #camBtn { width: 100%; padding: 14px; font-size: 18px; margin-bottom: 10px; }
    #cam { background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 10px; }
    video { width: 100%; display: block; }
    #result { border-radius: 10px; padding: 14px; text-align: center; background: #fff; }
    #result .t { font-size: 20px; font-weight: bold; }
    #result .n { font-size: 22px; font-weight: bold; margin: 6px 0 2px 0; }
    #result .m { font-size: 15px; margin-top: 6px; }
    #result .ev { font-size: 12px; opacity: 0.8; margin-bottom: 4px; }
    .ok { background: #d9f5df !important; border: 2px solid #2e9e48; }
    .out { background: #d9eaff !important; border: 2px solid #2f6fd0; }
    .warn { background: #fff3cd !important; border: 2px solid #d9a400; }
    .bad { background: #fde0e0 !important; border: 2px solid #c62828; }
    #info { font-size: 12px; color: #666; margin-top: 8px; text-align: center; }
    #signinMsg { color: #b00020; min-height: 20px; }
  </style>
</head>
<body>

  <!-- Sign-in screen -->
  <div id="signin" class="panel">
    <h2>JPSME Attendance</h2>
    <p>Officers: please sign in with your Google account.</p>
    <p id="signinMsg"></p>
    <div id="gbtn" style="display:flex; justify-content:center;"></div>
  </div>

  <!-- Main app -->
  <div id="app" class="hidden">
    <div class="top">
      <div><b id="who"></b><div id="role" style="font-size:12px;color:#555"></div></div>
      <button id="signout">Sign out</button>
    </div>

    <label for="event">Event</label>
    <select id="event"></select>
    <button id="refresh">Refresh events</button>

    <div id="stats">
      <div class="stat"><b id="sReg">-</b><span>Registered</span></div>
      <div class="stat"><b id="sIn">-</b><span>Timed in</span></div>
      <div class="stat"><b id="sInside">-</b><span>Inside</span></div>
      <div class="stat"><b id="sDone">-</b><span>Completed</span></div>
    </div>

    <button id="camBtn">Start camera</button>
    <div id="cam" class="hidden"><video id="video" playsinline muted></video></div>

    <div id="result">Select an event, then start the camera.</div>
    <div id="info"></div>
  </div>

  <canvas id="canvas" class="hidden"></canvas>

  <script>
    // ---------- SETTINGS ----------
    const CLIENT_ID = '646402889810-r6dflk4blp6p72tbqh6kme6vs3b230qp.apps.googleusercontent.com';
    const API_URL = 'https://script.google.com/macros/s/AKfycbwyudP0jRC3PE5uG7UC7gZ79wnSOnIiENxyrGBmoADG5AbB4rV8ZDGZFcz9JoA-AARI/exec';

    // ---------- STATE ----------
    let idToken = null;
    let events = [];
    let selectedEvent = '';
    let scanning = false;
    let busy = false;
    let detector = null;
    let engine = 'none';
    let stream = null;
    let lastCode = '';
    let lastTime = 0;

    const $ = function (id) { return document.getElementById(id); };
    const video = $('video');
    const canvas = $('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // ---------- START ----------
    window.addEventListener('load', function () {
      idToken = restoreToken();
      if (idToken) {
        loadApp();
      } else {
        showSignin('');
      }
      startSignIn();
    });

    function startSignIn() {
      if (!(window.google && google.accounts && google.accounts.id)) {
        setTimeout(startSignIn, 200);
        return;
      }
      google.accounts.id.initialize({
        client_id: CLIENT_ID,
        callback: onCredential,
        auto_select: true
      });
      google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with' });
    }

    function onCredential(response) {
      idToken = response.credential;
      try {
        const part = idToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        const payload = JSON.parse(atob(part));
        sessionStorage.setItem('jpsme_token', JSON.stringify({ token: idToken, exp: payload.exp }));
      } catch (e) { /* not important */ }
      loadApp();
    }

    function restoreToken() {
      try {
        const saved = JSON.parse(sessionStorage.getItem('jpsme_token') || 'null');
        if (saved && saved.exp * 1000 > Date.now() + 60000) return saved.token;
      } catch (e) { /* ignore */ }
      return null;
    }

    function clearToken() {
      idToken = null;
      try { sessionStorage.removeItem('jpsme_token'); } catch (e) { /* ignore */ }
    }

    function showSignin(message) {
      stopCamera();
      $('app').classList.add('hidden');
      $('signin').classList.remove('hidden');
      $('signinMsg').textContent = message || '';
    }

    function showApp() {
      $('signin').classList.add('hidden');
      $('app').classList.remove('hidden');
    }

    $('signout').onclick = function () {
      clearToken();
      if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
      showSignin('You have signed out.');
    };

    // ---------- TALKING TO THE BACKEND ----------
    async function api(payload) {
      payload.token = idToken;
      // No custom headers, so the browser sends a simple request
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
      return await res.json();
    }

    function handleAuthProblem(data) {
      clearToken();
      showSignin(data.denied
        ? data.message + ' Ask an admin to add you in the SETTINGS sheet, or sign in with a different account.'
        : 'Your sign-in expired. Please sign in again.');
    }

    async function loadApp() {
      $('signinMsg').textContent = 'Loading...';
      let data;
      try {
        data = await api({ action: 'init' });
      } catch (e) {
        showSignin('Could not reach the server. Check your internet connection and sign in again.');
        return;
      }
      if (!data.ok) {
        if (data.authError) { handleAuthProblem(data); return; }
        showSignin('Error: ' + data.message);
        return;
      }
      $('who').textContent = data.officer.name || data.officer.email;
      $('role').textContent = data.officer.role;
      events = data.events || [];
      fillEvents();
      showApp();
      refreshStats();
    }

    function fillEvents() {
      const select = $('event');
      const keep = selectedEvent;
      select.innerHTML = '';
      const first = document.createElement('option');
      first.value = '';
      first.textContent = events.length ? '- Select an event -' : '- No events found -';
      select.appendChild(first);
      events.forEach(function (ev) {
        const o = document.createElement('option');
        o.value = ev.name;
        o.textContent = ev.title;
        select.appendChild(o);
      });
      const stillThere = events.some(function (ev) { return ev.name === keep; });
      select.value = stillThere ? keep : '';
      selectedEvent = select.value;
      updateCamButton();
    }

    $('event').onchange = function () {
      selectedEvent = $('event').value;
      setStats(null);
      updateCamButton();
      refreshStats();
      if (selectedEvent) {
        showPlain('Event selected: ' + $('event').selectedOptions[0].textContent);
      }
    };

    $('refresh').onclick = async function () {
      try {
        const data = await api({ action: 'init' });
        if (data.ok) { events = data.events || []; fillEvents(); refreshStats(); }
        else if (data.authError) handleAuthProblem(data);
      } catch (e) { showPlain('Could not refresh. Check your connection.'); }
    };

    async function refreshStats() {
      if (!selectedEvent) return;
      try {
        const data = await api({ action: 'stats', event: selectedEvent });
        if (data.ok) setStats(data.stats);
        else if (data.authError) handleAuthProblem(data);
      } catch (e) { /* the numbers will update on the next scan */ }
    }

    function setStats(s) {
      $('sReg').textContent = s ? s.totalRegistered : '-';
      $('sIn').textContent = s ? s.timedIn : '-';
      $('sInside').textContent = s ? s.inside : '-';
      $('sDone').textContent = s ? s.completed : '-';
    }

    // ---------- SHOWING RESULTS ----------
    function showPlain(text) {
      const box = $('result');
      box.className = '';
      box.textContent = text;
    }

    function showResult(data) {
      const kinds = {
        TIME_IN:      { cls: 'ok',   title: 'TIME IN',           buzz: [120] },
        TIME_OUT:     { cls: 'out',  title: 'TIME OUT',          buzz: [120] },
        DUPLICATE:    { cls: 'warn', title: 'DUPLICATE SCAN',    buzz: [80, 60, 80] },
        COMPLETED:    { cls: 'warn', title: 'ALREADY COMPLETED', buzz: [80, 60, 80] },
        UNREGISTERED: { cls: 'bad',  title: 'NOT REGISTERED',    buzz: [400] },
        ERROR:        { cls: 'bad',  title: 'ERROR',             buzz: [400] }
      };
      const kind = kinds[data.status] || kinds.ERROR;
      const box = $('result');
      box.className = kind.cls;
      box.innerHTML = '';

      const ev = document.createElement('div');
      ev.className = 'ev';
      ev.textContent = 'Event: ' + ($('event').selectedOptions[0] ? $('event').selectedOptions[0].textContent : '');
      box.appendChild(ev);

      const t = document.createElement('div');
      t.className = 't';
      t.textContent = kind.title;
      box.appendChild(t);

      if (data.student) {
        const n = document.createElement('div');
        n.className = 'n';
        n.textContent = data.student.name;
        box.appendChild(n);
        const b = document.createElement('div');
        b.textContent = data.student.id + '  |  ' + data.student.block;
        box.appendChild(b);
      }

      const m = document.createElement('div');
      m.className = 'm';
      m.textContent = data.message || '';
      box.appendChild(m);

      if (navigator.vibrate) navigator.vibrate(kind.buzz);
    }

    // ---------- CAMERA ----------
    function updateCamButton() {
      $('camBtn').disabled = !selectedEvent;
      $('camBtn').textContent = scanning ? 'Stop camera' : 'Start camera';
    }

    $('camBtn').onclick = function () {
      if (scanning) stopCamera(); else startCamera();
    };

    async function setupEngine() {
      if ('BarcodeDetector' in window) {
        try {
          const formats = await BarcodeDetector.getSupportedFormats();
          if (formats.indexOf('qr_code') !== -1) {
            detector = new BarcodeDetector({ formats: ['qr_code'] });
            engine = 'built-in reader';
            return;
          }
        } catch (e) { /* use the library */ }
      }
      engine = (typeof jsQR !== 'undefined') ? 'jsQR library' : 'none';
    }

    async function startCamera() {
      if (!selectedEvent) { showPlain('Please select an event first.'); return; }
      try {
        await setupEngine();
        if (engine === 'none') { showPlain('The QR reading library did not load. Refresh the page.'); return; }
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
        try {
          await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        } catch (e) { /* not supported */ }
        $('cam').classList.remove('hidden');
        scanning = true;
        updateCamButton();
        $('info').textContent = 'Reader: ' + engine;
        tick();
      } catch (e) {
        showPlain('Camera error: ' + e.name + ' - ' + e.message);
      }
    }

    function stopCamera() {
      scanning = false;
      if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
      video.srcObject = null;
      $('cam').classList.add('hidden');
      updateCamButton();
    }

    async function tick() {
      if (!scanning) return;
      try {
        if (video.readyState >= 2 && video.videoWidth > 0 && !busy) {
          let text = null;
          if (detector) {
            const codes = await detector.detect(video);
            if (codes.length > 0) text = codes[0].rawValue;
          } else {
            const scale = Math.min(1, 800 / video.videoWidth);
            canvas.width = Math.round(video.videoWidth * scale);
            canvas.height = Math.round(video.videoHeight * scale);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
            if (code && code.data) text = code.data;
          }
          if (text) await handleCode(text);
        }
      } catch (e) { /* skip this frame */ }
      setTimeout(tick, 120);
    }

    // ---------- HANDLING ONE SCANNED CODE ----------
    async function handleCode(text) {
      const code = String(text).trim();
      if (!code || busy) return;
      const now = Date.now();
      if (code === lastCode && now - lastTime < 5000) return;   // same card still in view
      lastCode = code;
      lastTime = now;

      busy = true;
      showPlain('Checking...');
      try {
        const data = await api({ action: 'scan', event: selectedEvent, id: code });
        if (data.authError) {
          handleAuthProblem(data);
        } else {
          showResult(data);
          if (data.stats) setStats(data.stats);
        }
      } catch (e) {
        showResult({ status: 'ERROR',
          message: 'Network problem. This scan may not have been recorded, so please scan again.' });
      } finally {
        busy = false;
        lastTime = Date.now();
      }
    }
  </script>
</body>
</html>
